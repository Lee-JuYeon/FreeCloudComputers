name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # hub extra 포함 — HF 토큰 검증 테스트가 huggingface_hub 의 HfApi 를
          # monkeypatch 하므로 실제 라이브러리가 있어야 그 경로가 검증된다.
          pip install -e '.[dev,hub]'
      - name: Test
        env:
          PYTHONUTF8: "1"
        run: pytest tests/ -q
