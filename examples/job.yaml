# 예시 job — LoRA 학습을 무료 클라우드 풀에서 페일오버 실행.
# freecloud run examples/job.yaml        (※ 저장소 루트에서 실행할 것)
name: demo-lora

# 원격 노드에서 실행할 명령. 코드는 repo(git) 또는 workdir(업로드)로 올라간다.
# entrypoint 는 시작 시 체크포인트를 pull, N스텝마다 push 해야 재개가 성립한다(train_lora.py 참고).
entrypoint: "pip install -q freecloud huggingface_hub && python train_lora.py"

# 코드 소스(둘 중 하나). git repo 우선, 없으면 workdir 업로드.
#   · workdir 는 **opt-in** 이다 — 이 키를 지우면(기본값 "") 아무것도 올리지 않고,
#     커널은 예전과 바이트 단위로 똑같이 만들어진다(코드는 entrypoint 가 직접 확보).
#   · repo 가 비고 workdir 를 적었으면 **Kaggle 계열은 workdir 를 private 데이터셋으로 올려**
#     노드의 /kaggle/working/workdir 로 풀고 거기서 entrypoint 를 실행한다(FREECLOUD_WORKDIR).
#   · 항상 제외: .git/, __pycache__/, *.pyc, .env  (추가 제외는 FREECLOUD_WORKDIR_IGNORE)
#   · 크기 상한 FREECLOUD_WORKDIR_MAX_MB(기본 500MB) 초과 시 업로드 전에 즉시 실패.
#   · ⚠️ workdir 는 **실행한 디렉토리 기준**으로 해석된다.
#   · 업로드가 실패하면 커널을 push 하지 않고 JOB_CONFIG 로 중단한다(코드 없이 돌지 않게).
#   · colab/lightning/modal/saturn 은 아직 업로드하지 않는다(repo 를 쓰거나 entrypoint 가 직접 받을 것).
#   · ※ 이 예시의 train_lora.py 는 examples/ 안에 있다 — 그대로 돌리려면 workdir 를
#     "examples" 로 바꾸거나, 템플릿으로 복사해 쓸 때 자기 코드 루트를 가리키게 할 것.
repo: ""
workdir: "."

# ★ 재개의 핵심 — 모든 provider가 공유하는 상태 저장소(HF Hub repo id).
# 비우면 페일오버 시 처음부터 다시 학습한다. 반드시 채우는 걸 권장.
checkpoint_repo: "your-hf-username/demo-lora-ckpt"

# 회수할 산출물. Kaggle 계열은 실행이 끝나면(성공/실패 모두) kernels output 을
# ./artifacts/<name>/ 로 받고, 여기 적힌 파일이 그 안에 있는지 확인해 없으면 경고한다.
# (다른 어댑터는 아직 회수하지 못하고 경고만 한다 — entrypoint 안에서 HF Hub 로 올릴 것.)
artifacts:
  - "adapter_model.safetensors"

# provider 필터. 못 맞추는 provider는 자동 스킵.
needs:
  gpu: "T4"
  min_vram_gb: 16
  headless: true

# 원격에 주입할 env. HF_TOKEN 등 비밀은 여기 넣지 말고 provider Secret/로컬 env로.
env:
  EPOCHS: "3"

max_runtime_s: 5400          # 단일 노드 한도(무료 세션 안쪽). 초과 전 체크포인트 남기고 페일오버.

# 시도 순서(비우면 기본: lightning,kaggle,colab,modal).
providers: [lightning, kaggle, colab, modal]

# 성공 판정. 회수 디렉토리(그리고 cwd) 기준으로 평가하고, 커널이 complete 인데 매치가
# 0이면 NO_ARTIFACT 로 **중단**한다(페일오버 아님 — 코드가 파일을 안 만든 것).
# 비우면 이 검사를 하지 않는다.
success_glob: ""
